[build]
  command = "npm ci && npm run dev:prepare && npm --prefix docs ci && npm --prefix docs run generate"
  publish = "docs/.output/public"

[build.environment]
  NODE_VERSION = "22.22.2"
  NPM_FLAGS = "--legacy-peer-deps"

[context.deploy-preview]
  command = "npm ci && npm run dev:prepare && npm --prefix docs ci && npm --prefix docs run generate"
